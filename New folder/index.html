<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <style>
    /* Reset and Typography */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #202124;
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-width: 400px;
    }
    a {
      text-decoration: none;
      color: #70757a;
    }
    a:hover {
      text-decoration: underline;
    }

    /* Top Navigation Header */
    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 6px 16px;
      height: 60px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .nav-links a {
      color: rgba(0,0,0,0.87);
    }
    /* Apps Grid Icon */
    .apps-icon {
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .apps-icon:hover {
      background-color: rgba(60,64,67,0.08);
    }
    .apps-icon svg {
      fill: #5f6368;
      width: 24px;
      height: 24px;
    }
    /* Sign In Button */
    .btn-signin {
      background-color: #1a73e8;
      color: #fff !important;
      padding: 9px 23px;
      border-radius: 4px;
      font-weight: 500;
      letter-spacing: 0.25px;
    }
    .btn-signin:hover {
      background-color: #1b66c9;
      text-decoration: none;
      box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
    }

    /* Main Content Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 5%;
    }
    .logo {
      margin-bottom: 28px;
      user-select: none;
    }
    .logo span {
      font-size: 90px;
      font-weight: 500;
      letter-spacing: -2px;
    }
    .logo-g1 { color: #4285f4; }
    .logo-o1 { color: #ea4335; }
    .logo-o2 { color: #fbbc05; }
    .logo-g2 { color: #4285f4; }
    .logo-l  { color: #34a853; }
    .logo-e  { color: #ea4335; }

    /* Search Container */
    .search-container {
      width: 100%;
      max-width: 584px;
      padding: 0 20px;
      margin-bottom: 29px;
    }
    .search-box {
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      height: 46px;
      background: #fff;
    }
    .search-box:hover, .search-box:focus-within {
      background-color: #fff;
      box-shadow: 0 1px 6px rgba(32,33,36,0.28);
      border-color: rgba(223,225,229,0);
    }
    .search-icon, .mic-icon, .lens-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .search-icon svg {
      fill: #9aa0a6;
      width: 20px;
      height: 20px;
      margin-right: 10px;
    }
    .search-box input {
      flex: 1;
      border: none;
      height: 100%;
      font-size: 16px;
      color: #000;
      outline: none;
      background: transparent;
    }
    .action-icons {
      display: flex;
      gap: 12px;
    }
    .mic-icon svg, .lens-icon svg {
      width: 24px;
      height: 24px;
    }

    /* Action Buttons */
    .buttons-container {
      display: flex;
      gap: 12px;
    }
    .btn-search {
      background-color: #f8f9fa;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      color: #3c4043;
      font-size: 14px;
      padding: 0 16px;
      height: 36px;
      min-width: 54px;
      cursor: pointer;
      user-select: none;
    }
    .btn-search:hover {
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
      background-color: #f8f9fa;
      border: 1px solid #dadce0;
      color: #202124;
    }
    .btn-search:focus {
      border: 1px solid #4285f4;
      outline: none;
    }

    /* Footer Styles */
    footer {
      background: #f2f2f2;
      border-top: 1px solid #e4e4e4;
    }
    .footer-location {
      padding: 15px 30px;
      border-bottom: 1px solid #e4e4e4;
      color: rgba(0,0,0,0.54);
    }
    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      padding: 0 20px;
    }
    .footer-left, .footer-right {
      display: flex;
      flex-wrap: wrap;
    }
    .footer-links a {
      display: block;
      padding: 15px;
      color: #70757a;
    }
    @media (max-width: 670px) {
      .footer-links {
        justify-content: center;
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header Section -->
  <header>
    <nav class="nav-links">
      <a href="https://mail.google.com">Gmail</a>
      <a href="https://google.com">Images</a>
      <!-- Apps Grid Menu -->
      <div class="apps-icon" title="Google apps">
        <svg viewBox="0 0 24 24"><path d="M6,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM16,6c0,1.1 0.9,2 2,2s2,-0.9 2,-2 -0.9,-2 -2,-2 -2,0.9 -2,2zM12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2z"></path></svg>
      </div>
      <a href="https://accounts.google.com" class="btn-signin">Sign in</a>
    </nav>
  </header>

  <!-- Main Functional Component -->
  <main>
    <!-- Styled Google Logo -->
    <div class="logo">
      <span class="logo-g1">G</span><span class="logo-o1">o</span><span class="logo-o2">o</span><span class="logo-g2">g</span><span class="logo-l">l</span><span class="logo-e">e</span>
    </div>

    <!-- Live Search Form targeting Google's native Search Processor -->
    <form action="https://google.com" method="GET" class="search-container">
      <div class="search-box">
        <div class="search-icon">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
        </div>
        <!-- Required 'q' name attribute allows this local template to perform active web queries -->
        <input type="text" name="q" autofocus autocomplete="off">
        <div class="action-icons">
          <div class="mic-icon" title="Search by voice">
            <svg viewBox="0 0 24 24"><path fill="#4285f4" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path fill="#34a853" d="M12 17c-2.76 0-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V22h2v-3.08c3.39-.49 6-3.39 6-6.92h-2c0 2.76-2.24 5-5 5z"/></svg>
          </div>
          <div class="lens-icon" title="Search by image">
            <svg viewBox="0 0 24 24"><path fill="#4285f4" d="M5 2c-1.7 0-3 1.3-3 3v4h2V5c0-.6.4-1 1-1h4V2H5z"/><path fill="#ea4335" d="M19 2h-4v2h4c.6 0 1 .4 1 1v4h2V5c0-1.7-1.3-3-3-3z"/><path fill="#fbbc05" d="M5 22h4v-2H5c-.6 0-1-.4-1-1v-4H2v4c0 1.7 1.3 3 3 3z"/><path fill="#34a853" d="M19 22c1.7 0 3-1.3 3-3v-4h-2v4c0 .6-.4 1-1 1h-4v2h4z"/><path fill="#4285f4" d="M12 8c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4z"/></svg>
          </div>
        </div>
      </div>

      <!-- Functional Form Submission Controls -->
      <center style="margin-top: 18px;">
        <div class="buttons-container">
          <button type="submit" class="btn-search">Google Search</button>
          <button type="submit" name="btnI" value="1" class="btn-search">I'm Feeling Lucky</button>
        </div>
      </center>
    </form>
  </main>

  <!-- Complete Standard Footer Component -->
  <footer>
    <div class="footer-location">United States</div>
    <div class="footer-links">
      <div class="footer-left">
        <a href="https://about.google">About</a>
        <a href="https://google.com">Advertising</a>
        <a href="https://google.com">Business</a>
        <a href="https://google.com">How Search works</a>
      </div>
      <div class="footer-right">
        <a href="https://google.com">Privacy</a>
        <a href="https://google.com">Terms</a>
        <a href="#">Settings</a>
      </div>
    </div>
  </footer>

</body>
</html>
